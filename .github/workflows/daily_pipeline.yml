name: Daily Weather Pipeline

on:
  schedule:
    - cron: '22 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weather pipeline
        env:
          TZ: Europe/Warsaw
        run: python main.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weather_forecast.db weather_lgbm_model.joblib model_features.joblib
          git add -f plots/ || true
          git diff --staged --quiet || git commit -m "chore: daily weather update and predictions"
          git push
